<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Escolha uma Ação! (Layout)</title>
  <style>
    :root{
      --gold-1:#f7e3a4;
      --gold-2:#e8c86a;
      --gold-3:#c89a2e;
      --gold-4:#7a4f12;

      --paper-1:#f4e7c7;
      --paper-2:#ead7ae;
      --paper-3:#d0b784;

      --wood-1:#5a2f12;
      --wood-2:#7a3b16;
      --wood-3:#a35b22;

      --ink:#2a1a0b;
      --shadow: 0 18px 40px rgba(0,0,0,.45);
      --soft: 0 10px 20px rgba(0,0,0,.25);

      --btn-green:#2e7d32;
      --btn-red:#a4241a;
      --btn-blue:#1d4ed8;
      --btn-purple:#6d28d9;
      --btn-gold:#b7791f;

      --ui-radius: 18px;
      --stroke: rgba(255,255,255,.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: #f7f2e9;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(900px 700px at 10% 50%, rgba(0,0,0,.28), transparent 55%),
        radial-gradient(900px 700px at 90% 55%, rgba(0,0,0,.33), transparent 55%),
        linear-gradient(180deg, #0c1320 0%, #0a1a23 40%, #0a131a 100%);
      overflow-x:hidden;
    }

    /* Subtle "forest" silhouettes using gradients */
    .forest{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.95;
      filter: saturate(1.05);
    }
    .forest::before,
    .forest::after{
      content:"";
      position:absolute; inset:-10%;
      background:
        radial-gradient(250px 450px at 10% 25%, rgba(0,0,0,.35), transparent 60%),
        radial-gradient(260px 520px at 18% 35%, rgba(0,0,0,.25), transparent 65%),
        radial-gradient(260px 520px at 86% 35%, rgba(0,0,0,.25), transparent 65%),
        radial-gradient(300px 620px at 92% 30%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(180deg, rgba(16,44,56,.25), rgba(0,0,0,.0) 35%, rgba(0,0,0,.35));
    }
    .forest::after{
      transform: scale(1.08);
      opacity:.65;
      filter: blur(1px);
      background:
        radial-gradient(220px 420px at 30% 15%, rgba(0,0,0,.28), transparent 60%),
        radial-gradient(220px 520px at 55% 18%, rgba(0,0,0,.18), transparent 65%),
        radial-gradient(280px 540px at 70% 18%, rgba(0,0,0,.25), transparent 65%),
        linear-gradient(180deg, rgba(13,34,44,.18), rgba(0,0,0,.0) 40%, rgba(0,0,0,.45));
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding: 18px 14px 26px;
      position:relative;
    }

    .phone{
      width:min(460px, 100%);
      border-radius: 26px;
      position:relative;
      padding: 16px 14px 18px;
    }

    /* Ornaments / props */
    .prop{
      position:absolute;
      pointer-events:none;
      opacity:.95;
    }

    .prop.owl{
      left: 18px;
      top: 270px;
      width: 88px;
      height: 60px;
      transform: rotate(-6deg);
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.35));
    }
    .prop.owl::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 32% 42%, #ffd98a 0 9px, transparent 10px),
        radial-gradient(circle at 68% 42%, #ffd98a 0 9px, transparent 10px),
        radial-gradient(circle at 32% 42%, #2b1a0b 0 4px, transparent 5px),
        radial-gradient(circle at 68% 42%, #2b1a0b 0 4px, transparent 5px),
        radial-gradient(20px 16px at 50% 54%, #e2a654 0 55%, transparent 56%),
        radial-gradient(65px 48px at 50% 62%, #6b3c1a 0 60%, #3a1e0d 61% 100%);
      border-radius: 30px 30px 40px 40px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.08);
    }
    .prop.owl::after{
      content:"";
      position:absolute;
      left: 40%;
      top: 68%;
      width: 20px;
      height: 12px;
      background: radial-gradient(18px 12px at 50% 40%, #b05e22 0 60%, transparent 61%);
      border-radius: 999px;
      transform: rotate(8deg);
      opacity:.8;
    }

    .prop.torch{
      left: 16px;
      bottom: 92px;
      width: 60px;
      height: 160px;
      filter: drop-shadow(0 14px 12px rgba(0,0,0,.45));
    }
    .prop.torch::before{
      content:"";
      position:absolute;
      left: 50%;
      bottom: 0;
      width: 14px;
      height: 110px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #7a4517, #3b210b);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }
    .prop.torch::after{
      content:"";
      position:absolute;
      left: 50%;
      top: 0;
      width: 50px;
      height: 70px;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 50% 62%, rgba(255,120,0,.0) 0 24px, rgba(255,120,0,.25) 25px 32px, rgba(255,120,0,0) 33px),
        radial-gradient(40px 55px at 52% 60%, #ffd25b 0 35%, #ff8a1f 55%, rgba(255,0,0,0) 70%),
        radial-gradient(28px 50px at 44% 66%, #fff1a6 0 25%, #ffb400 48%, rgba(255,0,0,0) 75%),
        radial-gradient(24px 40px at 58% 70%, #fff3b8 0 22%, #ff9a2a 52%, rgba(255,0,0,0) 80%);
      border-radius: 999px;
      filter: blur(.2px);
    }

    .prop.scroll{
      right: 12px;
      bottom: 74px;
      width: 86px;
      height: 64px;
      transform: rotate(10deg);
      filter: drop-shadow(0 14px 12px rgba(0,0,0,.35));
    }
    .prop.scroll::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(24px 18px at 22% 70%, #caa46a 0 62%, transparent 63%),
        radial-gradient(24px 18px at 78% 70%, #caa46a 0 62%, transparent 63%),
        linear-gradient(180deg, #f2e1b7, #d6bd86);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      border: 1px solid rgba(0,0,0,.18);
    }
    .prop.chest{
      right: 10px;
      bottom: 124px;
      width: 110px;
      height: 78px;
      transform: rotate(-2deg);
      filter: drop-shadow(0 18px 16px rgba(0,0,0,.45));
    }
    .prop.chest::before{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(180deg, #7a3e18, #3a1d0b);
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.35);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.09);
    }
    .prop.chest::after{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%,-40%);
      background:
        radial-gradient(circle at 50% 55%, rgba(0,0,0,.25), transparent 60%),
        linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-3));
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.35);
      box-shadow: 0 6px 10px rgba(0,0,0,.25);
    }

    /* Top ribbons */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .ribbon{
      position:relative;
      flex: 1;
      max-width: 46%;
      height: 54px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 18px;
      border-radius: 14px;
      color: #fff3cf;
      text-shadow: 0 2px 0 rgba(0,0,0,.35);
      font-weight: 800;
      letter-spacing:.3px;
      background:
        linear-gradient(180deg, #8b4a1c, #5d2d10);
      box-shadow: var(--soft);
      border: 1px solid rgba(0,0,0,.35);
    }
    .ribbon::before{
      content:"";
      position:absolute; inset:6px;
      border-radius: 12px;
      border: 2px solid rgba(255,232,170,.35);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
      pointer-events:none;
    }
    .ribbon::after{
      content:"";
      position:absolute;
      left: -10px;
      width: 16px;
      height: 16px;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-3));
      transform: rotate(45deg);
      border-radius: 3px;
      box-shadow: 0 6px 10px rgba(0,0,0,.25);
    }
    .ribbon.right{
      max-width: 56%;
    }
    .ribbon.right::after{
      left:auto; right:-10px;
    }

    /* Story card */
    .story-card{
      position:relative;
      margin: 10px 0 14px;
      padding: 18px 18px 18px;
      border-radius: 18px;
      color: var(--ink);
      box-shadow: var(--shadow);
      background:
        radial-gradient(120px 90px at 20% 20%, rgba(255,255,255,.45), transparent 55%),
        radial-gradient(120px 90px at 80% 25%, rgba(255,255,255,.25), transparent 55%),
        linear-gradient(180deg, var(--paper-1), var(--paper-2) 55%, var(--paper-3));
      border: 1px solid rgba(0,0,0,.25);
      overflow:hidden;
    }
    .story-card::before{
      content:"";
      position:absolute; inset:10px;
      border-radius: 14px;
      border: 2px solid rgba(122,79,18,.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
      pointer-events:none;
    }
    .story-text{
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      text-align:center;
      padding: 10px 6px;
    }

    /* Timer chip */
    .timer{
      position:absolute;
      right: 14px;
      top: -16px;
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px 10px 14px;
      border-radius: 16px;
      color: #fff2c8;
      background: linear-gradient(180deg, #6a2d12, #3b1608);
      border: 1px solid rgba(0,0,0,.4);
      box-shadow: 0 14px 24px rgba(0,0,0,.35);
    }
    .timer strong{
      font-weight: 900;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .timer .sec{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 20px;
      min-width: 2ch;
      text-align:right;
    }
    .hourglass{
      width: 22px;
      height: 26px;
      position:relative;
      border-radius: 7px;
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 40%, var(--gold-3));
      border: 1px solid rgba(0,0,0,.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    .hourglass:before{
      content:"";
      position:absolute; inset:5px 6px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%),
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(circle at 50% 70%, rgba(0,0,0,.15), transparent 65%);
      clip-path: polygon(0 0,100% 0,62% 50%,100% 100%,0 100%,38% 50%);
      border-radius: 4px;
      opacity:.85;
    }

    /* Action buttons */
    .actions{
      display:flex;
      flex-direction:column;
      gap: 12px;
      padding: 0 4px;
    }
    .action{
      position:relative;
      height: 70px;
      border-radius: 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 18px;
      color: #fff;
      font-weight: 900;
      font-size: 30px;
      letter-spacing:.2px;
      text-shadow: 0 2px 0 rgba(0,0,0,.4);
      border: 1px solid rgba(0,0,0,.45);
      box-shadow: 0 12px 22px rgba(0,0,0,.35);
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, filter .12s ease;
      overflow:hidden;
    }
    .action:active{ transform: translateY(1px) scale(.995); }
    .action:hover{ filter: brightness(1.05) saturate(1.08); }

    /* Ornate frame */
    .action::before{
      content:"";
      position:absolute; inset:7px;
      border-radius: 14px;
      border: 2px solid rgba(255,240,200,.35);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.18),
        inset 0 0 18px rgba(0,0,0,.12);
      pointer-events:none;
    }
    .action::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(70px 30px at 10% 30%, rgba(255,255,255,.18), transparent 60%),
        radial-gradient(80px 40px at 90% 40%, rgba(255,255,255,.12), transparent 65%);
      pointer-events:none;
      opacity:.9;
    }

    .action .label{
      display:flex;
      align-items:center;
      gap: 12px;
      z-index:1;
      text-align:center;
    }
    .action .n{
      font-size: 32px;
      opacity:.95;
    }
    .action .t{
      font-size: 30px;
      font-weight: 900;
    }

    /* Colors like the screenshot */
    .green{ background: linear-gradient(180deg, #2f8a36, #1c5c22); }
    .red{ background: linear-gradient(180deg, #b12c22, #6d160f); }
    .blue{ background: linear-gradient(180deg, #2a64e8, #163a9c); }
    .purple{ background: linear-gradient(180deg, #7b35e6, #4c1aa8); }
    .gold{ background: linear-gradient(180deg, #c88a22, #7a4f12); }

    /* Bottom HUD */
    .hud{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 12px;
      margin-top: 16px;
      padding: 0 6px;
    }
    .pill{
      display:flex;
      align-items:center;
      gap: 10px;
      height: 54px;
      padding: 0 16px 0 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3c1b0b, #251006);
      border: 1px solid rgba(0,0,0,.45);
      box-shadow: 0 16px 30px rgba(0,0,0,.45);
      color: #f6e7c2;
      font-weight: 900;
      font-size: 28px;
      text-shadow: 0 2px 0 rgba(0,0,0,.35);
      min-width: 132px;
      justify-content:center;
    }
    .pill .icon{
      width: 30px; height: 30px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      font-size: 18px;
      border: 1px solid rgba(0,0,0,.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }
    .coin{
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 45%, var(--gold-3));
      color:#3b220c;
    }
    .heart{
      background: linear-gradient(180deg, #ff5a5a, #c51717);
      color:#fff;
    }

    /* Tiny corner flourish on phone */
    .frame{
      position:absolute;
      inset:-6px;
      border-radius: 30px;
      pointer-events:none;
      opacity:.55;
      background:
        radial-gradient(140px 90px at 20% 0%, rgba(255,220,150,.15), transparent 60%),
        radial-gradient(160px 110px at 80% 0%, rgba(255,220,150,.10), transparent 65%),
        radial-gradient(260px 160px at 50% 100%, rgba(0,0,0,.25), transparent 65%);
      filter: blur(.2px);
    }

    /* Selected state */
    .action.selected{
      outline: 3px solid rgba(255,236,170,.55);
      box-shadow: 0 18px 32px rgba(0,0,0,.55), 0 0 0 3px rgba(255,236,170,.22);
      transform: translateY(-1px);
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.72);
      color: #fff;
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 12px;
      border-radius: 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: 14px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      box-shadow: 0 16px 32px rgba(0,0,0,.45);
      max-width: min(520px, calc(100% - 24px));
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* Responsive typography */
    @media (max-width: 420px){
      .story-text{ font-size: 20px; }
      .action{ height: 66px; font-size: 26px; }
      .action .n{ font-size: 28px; }
      .action .t{ font-size: 26px; }
      .prop.owl{ top: 258px; transform: scale(.92) rotate(-6deg); }
    }
  </style>
</head>
<body>
  <div class="forest" aria-hidden="true"></div>

  <div class="wrap">
    <div class="phone" role="application" aria-label="Tela de escolhas">
      <div class="frame" aria-hidden="true"></div>

      <!-- Decorative props -->
      <div class="prop owl" aria-hidden="true"></div>
      <div class="prop torch" aria-hidden="true"></div>
      <div class="prop chest" aria-hidden="true"></div>
      <div class="prop scroll" aria-hidden="true"></div>

      <div class="topbar">
        <div class="ribbon">História</div>
        <div class="ribbon right">Escolha uma Ação!</div>
      </div>

      <section class="story-card" aria-label="História">
        <div class="timer" aria-label="Tempo restante">
          <strong>Tempo:</strong>
          <span class="sec" id="sec">25</span>
          <span class="hourglass" aria-hidden="true"></span>
        </div>

        <div class="story-text" id="story">
          Você caminha pela floresta escura e ouve um estralho ruído entre as árvores.
          Algo se move nas sombras à sua frente. O que você faz?
        </div>
      </section>

      <section class="actions" aria-label="Ações">
        <div class="action green" data-choice="1" tabindex="0" role="button" aria-label="Investigar o barulho">
          <div class="label"><span class="n">1.</span><span class="t">Investigar o barulho</span></div>
        </div>
        <div class="action red" data-choice="2" tabindex="0" role="button" aria-label="Sacar sua espada">
          <div class="label"><span class="n">2.</span><span class="t">Sacar sua espada</span></div>
        </div>
        <div class="action blue" data-choice="3" tabindex="0" role="button" aria-label="Se esconder entre as árvores">
          <div class="label"><span class="n">3.</span><span class="t">Se esconder entre as árvores</span></div>
        </div>
        <div class="action purple" data-choice="4" tabindex="0" role="button" aria-label="Preparar uma magia">
          <div class="label"><span class="n">4.</span><span class="t">Preparar uma magia</span></div>
        </div>
        <div class="action gold" data-choice="5" tabindex="0" role="button" aria-label="Fugir rapidamente">
          <div class="label"><span class="n">5.</span><span class="t">Fugir rapidamente</span></div>
        </div>
      </section>

      <footer class="hud" aria-label="HUD">
        <div class="pill" aria-label="Moedas">
          <span class="icon coin" aria-hidden="true">⛁</span>
          <span id="coins">100</span>
        </div>
        <div class="pill" aria-label="Vidas">
          <span class="icon heart" aria-hidden="true">❤</span>
          <span id="lives">3</span>
        </div>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ====== Simple timer + button selection (no libs) ======
    const secEl = document.getElementById("sec");
    const toast = document.getElementById("toast");
    const actions = Array.from(document.querySelectorAll(".action"));

    let seconds = 25;
    let timerId = null;

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 1300);
    }

    function setSelected(choice){
      actions.forEach(a => a.classList.toggle("selected", a.dataset.choice === String(choice)));
    }

    function startTimer(){
      stopTimer();
      secEl.textContent = String(seconds);
      timerId = setInterval(() => {
        seconds = Math.max(0, seconds - 1);
        secEl.textContent = String(seconds);
        if(seconds === 0){
          stopTimer();
          showToast("Tempo esgotado!");
        }
      }, 1000);
    }

    function stopTimer(){
      if(timerId){
        clearInterval(timerId);
        timerId = null;
      }
    }

    // Click + keyboard support
    actions.forEach(a => {
      a.addEventListener("click", () => {
        setSelected(a.dataset.choice);
        showToast(`Escolha ${a.dataset.choice} selecionada.`);
      });

      a.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          a.click();
        }
      });
    });

    // Auto start
    startTimer();

    // If you want to restart timer when user picks something:
    // actions.forEach(a => a.addEventListener("click", () => { seconds = 25; startTimer(); }));
  </script>
</body>
</html>
