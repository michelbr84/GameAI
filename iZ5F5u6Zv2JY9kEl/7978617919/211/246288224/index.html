<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Escolha do Destino</title>
    <meta name="description" content="Um RPG em que você escolhe o tipo de aventura que quer viver. Sci-fi, Fantasia, Terror Cômico ou Mistério.">
    <style>
        :root {
            --bg0: #070A10;
            --bg1: #0B1220;
            --card: rgba(255, 255, 255, .06);
            --card2: rgba(255, 255, 255, .08);
            --stroke: rgba(255, 255, 255, .12);
            --txt: rgba(255, 255, 255, .92);
            --muted: rgba(255, 255, 255, .68);
            --muted2: rgba(255, 255, 255, .52);
            --good: rgba(70, 230, 170, .18);
            --bad: rgba(255, 90, 120, .16);
            --accentA: #7C5CF7;
            --accentB: #22D3EE;
            --accentC: #3DD999;
            --shadow: 0 20px 50px rgba(0, 0, 0, .55);
            --radius: 18px;
            --radius2: 24px;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--sans);
            color: var(--txt);
            background:
                radial-gradient(1200px 700px at 10% 10%, rgba(124, 92, 255, .18), transparent 60%),
                radial-gradient(900px 600px at 80% 20%, rgba(34, 211, 238, .14), transparent 60%),
                radial-gradient(900px 700px at 30% 90%, rgba(52, 211, 153, .12), transparent 60%),
                linear-gradient(180deg, var(--bg0), var(--bg1));
            overflow-x: hidden;
        }
        a { color: inherit; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 42px; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--stroke);
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
            border-radius: 999px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 14px;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .logo { width: 34px; height: 34px; border-radius: 12px; background:
            radial-gradient(12px 12px at 30% 35%, rgba(255, 255, 255, .9), transparent 55%),
            conic-gradient(from 200deg, var(--accentA), var(--accentB), var(--accentC), var(--accentA));
            box-shadow: 0 12px 30px rgba(124, 92, 255, .22);
            border: 1px solid rgba(255, 255, 255, .18);
        }
        .brand h1 { font-size: 13px; margin: 0; letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions { display: flex; align-items: center; gap: 10px; }
        .chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid var(--stroke); color: var(--muted); font-size: 12px; user-select: none; }
        .btn {
            appearance: none; border: 1px solid var(--stroke); background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .05));
            color: var(--txt); padding: 10px 12px; border-radius: 999px; font-weight: 600; font-size: 12px; cursor: pointer; transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .20); backdrop-filter: blur(10px); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .btn:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .22); }
        .btn:active { transform: translateY(0) scale(.99); }
        .btn.primary { border-color: rgba(124, 92, 255, .35); background: linear-gradient(180deg, rgba(124, 92, 255, .32), rgba(34, 211, 238, .18)); box-shadow: 0 14px 35px rgba(124, 92, 255, .18); }
        .btn.ghost { background: rgba(255, 255, 255, .03); box-shadow: none; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; margin-top: 18px; align-items: start; }
        .card { border: 1px solid var(--stroke); background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03)); border-radius: var(--radius2); box-shadow: var(--shadow); overflow: hidden; }
        .cardHeader { padding: 18px 18px 0; }
        .storyTitle { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; }
        .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .14), transparent); margin: 16px 0; }
        .story { padding: 0 18px 18px; }
        .storyText { color: rgba(255, 255, 255, .86); font-size: 14.5px; line-height: 1.75; margin: 0; white-space: pre-wrap; }
        .questionBox { margin-top: 16px; padding: 14px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, .14);
            background:
                radial-gradient(800px 200px at 20% 0%, rgba(124, 92, 255, .20), transparent 55%),
                radial-gradient(700px 220px at 80% 0%, rgba(34, 211, 238, .15), transparent 55%),
                rgba(255, 255, 255, .04);
        }
        .questionLabel { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
        .questionTitle { margin: 0; font-size: 16px; line-height: 1.4; }
        .side { padding: 16px; }
        .side h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .78); }
        .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .choice {
            width: 100%; text-align: left; border: 1px solid var(--stroke); background: rgba(255, 255, 255, .04); border-radius: 16px; padding: 12px 12px; cursor: pointer; transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease; position: relative; overflow: hidden;
        }
        .choice:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); box-shadow: 0 14px 35px rgba(0, 0, 0, .18); }
        .choice:active { transform: translateY(0) scale(.995); }
        .choice .k { font-family: var(--mono); font-size: 11px; color: rgba(255, 255, 255, .60); letter-spacing: .06em; }
        .choice .t { margin-top: 6px; font-size: 13.5px; line-height: 1.45; color: rgba(255, 255, 255, .90); }
        .badge { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 6px 8px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(0, 0, 0, .18); color: rgba(255, 255, 255, .72); backdrop-filter: blur(10px); }
        .badge.good { background: var(--good); border-color: rgba(52, 211, 153, .28); color: rgba(210, 255, 240, .90); }
        .badge.bad { background: var(--bad); border-color: rgba(255, 90, 120, .30); color: rgba(255, 220, 230, .92); }
        .result { margin-top: 12px; padding: 12px; border-radius: 16px; border: 1px dashed rgba(255, 255, 255, .20); background: rgba(255, 255, 255, .03); color: var(--muted); font-size: 13px; line-height: 1.55; min-height: 56px; display: flex; gap: 10px; align-items: flex-start; }
        .dot { width: 10px; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .35); margin-top: 4px; flex: 0 0 auto; box-shadow: 0 0 0 4px rgba(255, 255, 255, .06); }
        .dot.good { background: rgba(52, 211, 153, .90); box-shadow: 0 0 0 4px rgba(52, 211, 153, .14); }
        .dot.bad { background: rgba(255, 90, 120, .95); box-shadow: 0 0 0 4px rgba(255, 90, 120, .14); }
        .footer { margin-top: 18px; color: rgba(255, 255, 255, .52); font-size: 12px; text-align: center; }
        .jsonPreview { font-family: var(--mono); font-size: 11px; line-height: 1.6; color: rgba(255, 255, 255, .64); background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 12px; overflow: auto; max-height: 240px; white-space: pre; }
        .srOnly { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .topbar { position: static; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar" role="navigation" aria-label="Barra superior">
            <div class="brand">
                <div class="logo" aria-hidden="true"></div>
                <h1 id="appTag">AVENTURA INTERATIVA</h1>
            </div>
            <div class="actions">
                <div class="chip" title="Estado do jogo">
                    <span aria-hidden="true">📜</span>
                    <span id="statusChip">Escolha sua aventura</span>
                </div>
                <button class="btn ghost" id="btnToggleJson" type="button" aria-expanded="false" aria-controls="jsonPanel">
                    <span aria-hidden="true">📄</span> JSON
                </button>
                <button class="btn primary" id="btnReset" type="button">
                    <span aria-hidden="true">🔁</span> Reiniciar
                </button>
            </div>
        </div>

        <main class="grid" role="main">
            <!-- História -->
            <section class="card" aria-labelledby="storyTitle">
                <div class="cardHeader">
                    <h2 class="srOnly">História</h2>
                    <h1 class="title storyTitle" id="storyTitle"></h1>
                    <p class="subtitle" id="storyDesc"></p>
                    <div class="divider"></div>
                </div>
                <div class="story">
                    <p class="storyText" id="storyText"></p>
                    <div class="questionBox" aria-labelledby="questionTitle">
                        <div class="questionLabel">
                            <span>O que você faz agora?</span>
                            <span id="hint" style="color: rgba(255,255,255,.5); font-size: 11px;">clique em uma opção</span>
                        </div>
                        <p class="questionTitle" id="questionTitle"></p>
                    </div>
                </div>
            </section>

            <!-- Painel lateral -->
            <aside class="side">
                <section class="card">
                    <div class="side">
                        <h2>Escolhas</h2>
                        <div class="choices" id="choices"></div>

                        <div class="result" id="resultBox" aria-live="polite">
                            <div class="dot" id="resultDot" aria-hidden="true"></div>
                            <div>
                                <div style="font-weight:700; color: rgba(255,255,255,.86); margin-bottom:2px;" id="resultTitle">Resultado</div>
                                <div id="resultText">Selecione um tipo de aventura para ver o destino.</div>
                            </div>
                        </div>

                        <div class="footer" id="footerNote">Dica: alguns caminhos têm recompensas inesperadas.</div>
                    </div>
                </section>

                <section class="card" id="jsonPanel" hidden>
                    <div class="side">
                        <h2>JSON (Preview)</h2>
                        <div class="jsonPreview" id="jsonPreview"></div>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <script>
        // JSON formato pelo usuário (online para ser 1 arquijo HTML)
        const RAW_JSON = [
            {
                "output": {
                    "Título da estória": "A Fuga pelo Ar",
                    "Descrição da estória": "Você se encontra em uma nave em movimento no espaço profundo. Uma falha crítica no sistema de suporte de vida deixa pouco tempo. Fuga é a única opção.",
                    "O que você faz agora?": "Escolha uma rota de fuga",
                    "Pergunta 01": "Qual é o seu nome?",
                    "Pergunta 02": "Qual é a sua habilidade principal?",
                    "Pergunta 03": "Qual é o seu maior medo?",
                    "Pergunta 04": "Você prefere agir sozinho ou em grupo?",
                    "Pergunta 05": "Qual é a primeira coisa que você faz ao acordar em um mundo desconhecido?"
                }
            }
        ];

        const $ = (sel) => document.querySelector(sel);
        const safeParse = (jsonStr) => { try { return JSON.parse(jsonStr); } catch (e) { return null; } }
        function classify(text) {
            // Simple heuristic: detect tags [EXCELENTE] and [FIM DE JOGO]
            const t = (text || "").toUpperCase();
            const isGood = t.includes("[EXCELENTE]") || t.includes("[EXCELENTE]");
            const isBad  = t.includes("[FIM DE JOGO") || t.includes("[FIM DE JOGO");
            return { isGood, isBad };
        }
        function prettyChoiceText(text) {
            // Remove final tag for better display, but keep sent.
            // Most common is "badge" separate.
            return (text || "")
                .replace(/\s*[(\[]EXCELENTE[)\]]/ig, "")
                .replace(/\s*[(\[]FIM DE JOGO[)\]]/ig, "")
                .trim();
        }
        function loadStory() {
            const data = safeParse(RAW_JSON);
            if (!data || !data[0] || !data[0].output) {
                $("#storyTitle").textContent = "JSON inválido";
                $("#storyDesc").textContent  = "Não foi possível carregar os dados.";
                $("#storyText").textContent  = "Verifique o JSON embutido.";
                return null;
            }
            return data[0].output;
        }
        function render() {
            const o = loadStory();
            if (!o) return;

            $("#storyTitle").textContent = o["Título da estória"] || "Sem título";
            $("#storyDesc").textContent  = o["Descrição da estória"] || "";
            $("#storyText").textContent  = o["Descrição da estória"] || "";
            $("#questionTitle").textContent = o["O que você faz agora?"] || "O que você faz agora?";

            // Build choices list in the exact order
            const questions = [
                { key:"Pergunta 01", k:"01" },
                { key:"Pergunta 02", k:"02" },
                { key:"Pergunta 03", k:"03" },
                { key:"Pergunta 04", k:"04" },
                { key:"Pergunta 05", k:"05" },
            ].map(q => ({ ...q, text: o[q.key] || "" }));

            const holder = $("#choices");
            holder.innerHTML = "";
            questions.forEach((q) => {
                const meta = classify(q.text);
                const btn = document.createElement("button");
                btn.className = "choice";
                btn.type = "button";
                const badge = document.createElement("div");
                badge.className = "badge";
                if (meta.isGood) { badge.classList.add("good"); badge.textContent = "Excelente"; }
                if (meta.isBad) { badge.classList.add("bad"); badge.textContent = "Fim de Jogo"; }
                const k = document.createElement("div");
                k.className = "k";
                k.textContent = `PERGUNTA ${q.k}`;
                const t = document.createElement("div");
                t.className = "t";
                t.textContent = prettyChoiceText(q.text);
                btn.appendChild(badge);
                btn.appendChild(k);
                btn.appendChild(t);
                btn.addEventListener("click", () => onPick(q, meta));
                holder.appendChild(btn);
            });

            // JSON preview
            $("#jsonPreview").textContent = JSON.stringify(o, null, 2);

            // Reset UI
            setResult("Resultado", "Selecione um tipo de aventura para ver o destino.", null);
            $("#statusChip").textContent = "Escolha sua aventura";
        }

        function setResult(title, text, kind /* 'good' | 'bad' | null */) {
            $("#resultTitle").textContent = title;
            $("#resultText").textContent = text;
            const dot = $("#resultDot");
            dot.className = "dot";
            if (kind === "good") dot.classList.add("good");
            if (kind === "bad") dot.classList.add("bad");
        }

        function onPick(q, meta) {
            const full = q.text || "";
            if (meta.isBad) {
                setResult("Fim de Jogo", full, "bad");
                $("#statusChip").textContent = "Você perdeu.";
                $("#footerNote").textContent = "Recupere-se e tente outra rota.";
            } else if (meta.isGood) {
                setResult("Excelente!", full, "good");
                $("#statusChip").textContent = "Envie que o universo aprovou.";
            } else {
                setResult("Resultado", full, null);
                $("#statusChip").textContent = "Escolha registrada.";
            }
        }

        // UI controls
        $("#btnReset").addEventListener("click", render);
        $("#btnToggleJson").addEventListener("click", () => {
            const panel = $("#jsonPanel");
            const isHidden = panel.hasAttribute("hidden");
            if (isHidden) {
                panel.removeAttribute("hidden");
                $("#btnToggleJson").setAttribute("aria-expanded", "true");
                $("#statusChip").textContent = "Vendo JSON";
            } else {
                panel.setAttribute("hidden", "");
                $("#btnToggleJson").setAttribute("aria-expanded", "false");
                $("#statusChip").textContent = "Escolha sua aventura";
            }
        });

        // Start
        render();
    </script>
</body>
</html>
